# The TotV shell's audio (pipewire-pulse of the votv user) is also reachable by the
# users' PC desktops, through /run/totv/shell/pulse/native (group votv).
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:/run/totv/shell/pulse/native" client.access = "unrestricted" }
    ]
}
