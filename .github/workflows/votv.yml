name: votv
on:
  push:
    paths: ['votv/**', '.github/workflows/votv.yml']
  pull_request:
    paths: ['votv/**', '.github/workflows/votv.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4 shellcheck libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 zip
          pip install PyQt6 pyflakes
      - name: Lua syntax
        run: for f in votv/mod/TotVOS/Scripts/*.lua votv/tests/lua/*.lua; do luac5.4 -p "$f"; done
      - name: Mod against mock UE4SS
        run: |
          T=$(mktemp -d)
          VOTV_OS_RUNTIME="$T" VOTV_OS_SAVES="$T" VOTV_OS_SYSCFG="$T/none.json" \
            lua5.4 votv/tests/lua/test_mod.lua votv/mod/TotVOS/Scripts
      - name: Host tests
        run: QT_QPA_PLATFORM=offscreen python3 -m unittest votv/tests/test_host.py
      - name: Lint
        run: |
          python3 -m pyflakes votv/host/lib votv/tests/test_host.py
          shellcheck -S warning votv/host/install.sh votv/host/update.d/50-votv votv/host/bin/votv-os-session \
            votv/host/bin/votv-os-session-main votv/host/bin/votv-pc-session votv/host/bin/votv-pc-desktop \
            votv/host/bin/votv-os-launch-game votv/host/bin/votv-os-install-game votv/host/bin/votv-os-fetch-deps \
            votv/host/bin/votv-os-r2modman votv/host/bin/votv-os-proton votv/mod/package.sh os/build.sh os/system/build-system.sh \
            os/iso/airootfs/usr/local/bin/totv-install os/packages/totv-base/totv-update os/packages/totv-base/totv-adduser \
            tools/write-usb.sh
          python3 -m pyflakes votv/host/bin/votv-os-game votv/host/bin/votv-wayland-socket
      - name: Package files into an empty root
        run: |
          R=$(mktemp -d)
          bash votv/host/install.sh --files-only "$R"
          test -f "$R/usr/lib/votv-os/mods/TotVOS/Scripts/main.lua"
          test -f "$R/usr/share/kwin/scripts/votv-os-wm/metadata.json"
          test -f "$R/usr/lib/systemd/system/totv-shell.service"
          for b in votv-saves votv-mods votv-os-ctl totvd votv-login; do python3 -m py_compile "$R/usr/bin/$b"; done
      - name: Thunderstore package
        run: bash votv/mod/package.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: TotVOS-thunderstore
          path: ${{ runner.temp }}/dist/*.zip
