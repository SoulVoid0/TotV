name: Build TotV OS

# Three images per build:
#   totv-<version>-x86_64.iso         the installer (USB), under 2 GiB (build.sh checks)
#   totv-system-<version>-x86_64.iso  the whole OS with Voices of the Void and r2modman,
#                                     bigger than 2 GiB: published as .partNN files of
#                                     1900 MiB plus a .parts index, which the installer
#                                     downloads (or finds on a drive) and merges
#   repo/                             the [totv] pacman repository: installed systems
#                                     update from the latest release (totv-update)
# Voices of the Void is downloaded from itch.io by votv-os-game; the VOTV_URL secret (a
# direct zip URL) or the ITCH_API_KEY secret make that independent of itch.io's page.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['os/**', 'votv/**', '.github/workflows/build-os.yml']
  pull_request:
    paths: ['os/**', 'votv/**', '.github/workflows/build-os.yml']
  workflow_dispatch:
    inputs:
      system:
        description: 'Also build the system image'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed archiso base-devel git curl unzip
      - uses: actions/checkout@v4
      - name: Build packages and the installer ISO
        run: |
          bash os/build.sh --out out --work /tmp/totv-build
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: totv-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: totv-repo
          path: out/repo/
          retention-days: 14

  system:
    needs: iso
    if: github.event_name != 'workflow_dispatch' || inputs.system
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          sudo mkdir -p /mnt/totv && sudo chmod 777 /mnt/totv
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: totv-repo
          path: /mnt/totv/repo
      - name: Build the system image in Arch Linux
        env:
          VOTV_URL: ${{ secrets.VOTV_URL }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          docker run --rm --privileged -v "$PWD:/src" -v /mnt/totv:/w -w /src \
            -e VOTV_URL -e ITCH_API_KEY archlinux:latest bash -c '
              set -e
              pacman-key --init && pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed arch-install-scripts squashfs-tools libisoburn curl
              bash os/system/build-system.sh --repo /w/repo --out /w/system --work /w/work
              rm -f /w/system/*.iso     # the parts hold it; the whole file is over 2 GiB
              chmod -R a+r /w/system'
          ls -la /mnt/totv/system
      - uses: actions/upload-artifact@v4
        with:
          name: totv-system
          path: /mnt/totv/system/
          compression-level: 0
          retention-days: 5

  # Boots the installer in QEMU, installs TotV unattended from the system image (on a
  # second virtual disk) onto a virtual disk, and boots the result with BIOS and UEFI.
  vm-test:
    needs: [iso, system]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: totv-iso
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: totv-system
          path: system
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf libarchive-tools e2fsprogs
      - name: Install from the system image and boot TotV in a VM
        run: bash os/tests/vm-install.sh out/totv-*-x86_64.iso vm-test system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-logs
          path: vm-test/*.log

  # A tag (v0.2.0, ...) publishes everything; installed systems' [totv] repository is
  # .../releases/latest/download, and the installer downloads the system image parts
  # from .../releases/download/v<version>.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [iso, system]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dl/totv-iso/*.iso
            dl/totv-iso/SHA256SUMS
            dl/totv-repo/*
            dl/totv-system/*.part*
