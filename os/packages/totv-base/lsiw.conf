# LSIW system configuration for TotV (/etc/lsiw/lsiw.conf, from totv-base).
#
# On TotV the C: drive is the Linux root: C:\etc\hosts is /etc/hosts and
# C:\home\<you> is /home/<you>. The Windows folders Windows expects right
# under C:\ are real folders at the top of the Linux file system, writable
# by the members of the group "cdrive" (every user the installer creates).
# The upstream example with every setting is
# /usr/share/doc/lsiw/lsiw.conf.example. Values in ~/.config/lsiw/lsiw.conf
# win over this file; the C: drive itself cannot be moved on TotV.

[drive]
c_drive = /

[variables]
WINDIR = /windows
CSIDL_PROGRAM_FILES = /Program Files
CSIDL_PROGRAM_FILESX86 = /Program Files (x86)
CSIDL_COMMON_APPDATA = /ProgramData
PROFILESFOLDER = /users
PUBLIC = /users/Public
DEFAULTUSERPROFILE = /users/Default
