# The Windows folders of the C: drive (C: = / on TotV). See /etc/lsiw/lsiw.conf.
d /windows                  2775 root cdrive -
d "/Program Files"          2775 root cdrive -
d "/Program Files (x86)"    2775 root cdrive -
d /ProgramData              2775 root cdrive -
d /users                    2775 root cdrive -
d /users/Public             2775 root cdrive -
d /users/Default            2775 root cdrive -
d /etc/totv                 0755 root root   -
d /etc/totv/session.d       0755 root root   -
